name: Build FrameGen APK

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Vulkan Shaders
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools
          if [ -d "app/src/main/cpp/shaders" ]; then
            cd app/src/main/cpp/shaders
            for f in *.comp; do
              [ -f "$f" ] && glslangValidator -V "$f" -o "${f%.comp}.spv"
            done
            mkdir -p ../../assets/shaders
            cp *.spv ../../assets/shaders/ 2>/dev/null || true
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FrameGen-APK
          path: app/build/outputs/apk/debug/*.apk
